<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pray Apostel — AI Engineer</title>
  <desc id="desc">A technical profile banner about voice agents, edge machine learning, reinforcement learning, and computer vision.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="1" opacity="0.65"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0d1117"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="770" height="360" rx="24" fill="url(#fade)" transform="rotate(180 385 180)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <circle cx="68" cy="49" r="5" fill="#ff7b72"/>
    <circle cx="86" cy="49" r="5" fill="#d29922"/>
    <circle cx="104" cy="49" r="5" fill="#3fb950"/>
    <text x="126" y="55" fill="#8b949e" font-size="14" letter-spacing="1.8">PRAY://PROFILE</text>

    <text x="66" y="130" fill="#f0f6fc" font-size="57" font-weight="750" letter-spacing="-2">PRAY APOSTEL</text>
    <text x="69" y="165" fill="#58a6ff" font-size="18" font-weight="650" letter-spacing="3.4">AI ENGINEER · SINGAPORE</text>

    <rect x="68" y="202" width="7" height="72" rx="3.5" fill="#a371f7"/>
    <text x="94" y="230" fill="#f0f6fc" font-size="28" font-weight="700" letter-spacing="-0.6">AI THAT LEAVES</text>
    <text x="94" y="266" fill="#f0f6fc" font-size="28" font-weight="700" letter-spacing="-0.6">THE NOTEBOOK.</text>

    <g font-size="12" font-weight="650" letter-spacing="1.1">
      <rect x="68" y="300" width="126" height="30" rx="15" fill="#0c2d48" stroke="#58a6ff"/>
      <text x="88" y="320" fill="#79c0ff">VOICE AGENTS</text>
      <rect x="204" y="300" width="95" height="30" rx="15" fill="#12261e" stroke="#3fb950"/>
      <text x="224" y="320" fill="#56d364">EDGE ML</text>
      <rect x="309" y="300" width="62" height="30" rx="15" fill="#271a40" stroke="#a371f7"/>
      <text x="329" y="320" fill="#d2a8ff">RL</text>
      <rect x="381" y="300" width="161" height="30" rx="15" fill="#342a12" stroke="#d29922"/>
      <text x="401" y="320" fill="#e3b341">COMPUTER VISION</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="38" width="374" height="284" rx="20" fill="#161b22" stroke="#30363d"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="788" y="73" fill="#8b949e" font-size="12" letter-spacing="1.5">AGENT.LOOP()</text>
    <circle cx="1103" cy="68" r="5" fill="#3fb950"/>
    <text x="1062" y="73" fill="#3fb950" font-size="10" letter-spacing="1">LIVE</text>

    <path d="M815 126 H891 M959 126 H1053 M1082 151 V226 M1053 250 H959 M891 250 H815" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="5 7"/>

    <g>
      <circle cx="806" cy="126" r="19" fill="#0c2d48" stroke="#58a6ff" stroke-width="2"/>
      <path d="M800 126 q6 -8 12 0 q-6 8 -12 0 M806 116 v-5 M806 141 v-5" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
      <text x="783" y="164" fill="#8b949e" font-size="10">listen</text>
    </g>

    <g>
      <rect x="891" y="96" width="68" height="60" rx="12" fill="#271a40" stroke="#a371f7" stroke-width="2"/>
      <circle cx="909" cy="116" r="5" fill="#a371f7"/>
      <circle cx="941" cy="116" r="5" fill="#a371f7"/>
      <path d="M907 137 h36" stroke="#a371f7" stroke-width="2" stroke-linecap="round"/>
      <text x="896" y="178" fill="#8b949e" font-size="10">reason</text>
    </g>

    <g>
      <circle cx="1072" cy="126" r="19" fill="#12261e" stroke="#3fb950" stroke-width="2"/>
      <path d="M1063 126 h18 M1072 117 v18" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
      <text x="1063" y="164" fill="#8b949e" font-size="10">act</text>
    </g>

    <g>
      <rect x="1047" y="226" width="50" height="48" rx="10" fill="#342a12" stroke="#d29922" stroke-width="2"/>
      <path d="M1058 242 h28 M1058 250 h19 M1058 258 h24" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
      <text x="1045" y="294" fill="#8b949e" font-size="10">tools</text>
    </g>

    <g>
      <rect x="891" y="220" width="68" height="60" rx="12" fill="#3d1f12" stroke="#f0883e" stroke-width="2"/>
      <path d="M904 260 l10 -20 10 15 8 -10 14 15 z" fill="none" stroke="#f0883e" stroke-width="2" stroke-linejoin="round"/>
      <text x="900" y="300" fill="#8b949e" font-size="10">perceive</text>
    </g>

    <g>
      <circle cx="806" cy="250" r="19" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
      <path d="M797 250 c6 -12 12 -12 18 0 c-6 12 -12 12 -18 0 z" fill="none" stroke="#8b949e" stroke-width="2"/>
      <circle cx="806" cy="250" r="3" fill="#8b949e"/>
      <text x="786" y="288" fill="#8b949e" font-size="10">learn</text>
    </g>

    <text x="788" y="309" fill="#6e7681" font-size="10">observe → decide → ship → repeat</text>
  </g>
</svg>
